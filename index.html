<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Mail</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        h1 { color: #00ff66; }
        .container { max-width: 600px; margin: auto; }
        input { padding: 10px; width: 70%; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #00ff66; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; }
        .box { background: #1e1e1e; padding: 15px; border-radius: 5px; margin-top: 20px; display: none; }
        .message-item { background: #2c2c2c; padding: 10px; margin: 5px 0; border-radius: 5px; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Temp Mail</h1>
        <input type="text" id="emailDisplay" readonly placeholder="Generate করুন...">
        <div>
            <button onclick="generateEmail()">Generate</button>
            <button onclick="checkEmail()">Refresh</button>
        </div>

        <div class="box" id="inboxBox">
            <h3>📬 Inbox</h3>
            <div id="inboxList">কোনো মেইল নাই।</div>
        </div>
    </div>

    <script>
        let login = "", domain = "";

        async function generateEmail() {
            const res = await fetch("https://www.1secmail.com/api/v1/?action=genRandomMailbox&count=1");
            const data = await res.json();
            const email = data[0];
            [login, domain] = email.split("@");
            document.getElementById("emailDisplay").value = email;
            document.getElementById("inboxBox").style.display = "block";
            checkEmail();
        }

        async function checkEmail() {
            if(!login || !domain) return;
            const res = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${login}&domain=${domain}`);
            const data = await res.json();
            const list = document.getElementById("inboxList");
            if(data.length === 0) {
                list.innerHTML = "কোনো মেইল নাই।";
                return;
            }
            list.innerHTML = data.map(msg => `
                <div class="message-item" onclick="readMessage(${msg.id})">
                    <strong>${msg.from}</strong> - ${msg.subject} <br>
                    <small>${msg.date}</small>
                </div>
            `).join('');
        }

        async function readMessage(id) {
            const res = await fetch(`https://www.1secmail.com/api/v1/?action=readMessage&login=${login}&domain=${domain}&id=${id}`);
            const data = await res.json();
            alert(`From: ${data.from}\nSubject: ${data.subject}\n\nBody:\n${data.textBody}`);
        }
    </script>
</body>
</html>
